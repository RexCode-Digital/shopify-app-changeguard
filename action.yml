name: ChangeGuard — Shopify App Config Review
description: Review Shopify app configuration changes in pull requests before deployment.
author: Efe Gökdemir
branding:
  icon: shield
  color: blue

inputs:
  base_sha:
    description: Pull request base commit SHA
    required: true
  head_sha:
    description: Pull request head commit SHA
    required: true
  fail_on:
    description: 'Failure policy: never, review, or unreviewed'
    required: false
    default: unreviewed

outputs:
  outcome:
    description: clean, findings, or incomplete
  finding_count:
    description: Number of semantic review findings
  highest_severity:
    description: Highest finding severity, or none
  highest_risk:
    description: Highest deterministic review risk, or none
  report:
    description: JSON review report
  reviewed_file_count:
    description: Number of changed Shopify app configuration files reviewed
  unreviewed_count:
    description: Number of changed configuration files that could not be reviewed
  rule_ids:
    description: Comma-separated stable rule IDs present in the report

runs:
  using: node24
  main: dist/action/index.js
