name: ChangeGuard — Shopify App Config Review
description: Unofficial, read-only review of Shopify app TOML changes in a pull request
author: Efe Gökdemir
branding:
  icon: shield
  color: blue

inputs:
  base_sha:
    description: Pull request base commit SHA
    required: true
  head_sha:
    description: Pull request head commit SHA
    required: true
  fail_on:
    description: 'Failure policy: never, review, or unreviewed'
    required: false
    default: unreviewed

outputs:
  outcome:
    description: clean, findings, or incomplete
  finding_count:
    description: Number of semantic review findings
  highest_severity:
    description: Highest finding severity, or none
  report:
    description: JSON review report

runs:
  using: node24
  main: dist/action/index.js
