name = "Example App"
client_id = "a61950a2cbd5f32876b0b55587ec7a27"
application_url = "https://app.example.test/"
embedded = true
handle = "example-app"
extension_directories = ["extensions/", "custom-extensions/"]
web_directories = ["web/"]

[access_scopes]
scopes = "read_products"
optional_scopes = ["read_customers"]

[access.admin]
embedded_app_direct_api_access = true
direct_api_mode = "online"

[auth]
redirect_urls = ["https://app.example.test/api/auth/callback"]

[customer_authentication]
redirect_uris = ["https://app.example.test/api/customer/callback"]
javascript_origins = ["https://app.example.test"]
logout_urls = ["https://app.example.test/api/customer/logout"]

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks"

[events]
api_version = "2026-10"

[[events.subscription]]
handle = "product-updates"
topic = "Product"
actions = ["create", "update"]
triggers = ["title"]
uri = "/events/products"

[app_proxy]
url = "https://app.example.test/proxy"
prefix = "apps"
subpath = "example"

[pos]
embedded = false

[app_preferences]
url = "https://app.example.test/preferences"

[build]
automatically_update_urls_on_dev = false
