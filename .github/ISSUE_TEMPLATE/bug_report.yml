name: Bug report
description: Report a reproducible ChangeGuard problem
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: input
    id: version
    attributes:
      label: ChangeGuard version
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      options: [CLI, GitHub Action]
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Minimal anonymised TOML
      description: Remove secrets, credentials, private URLs, webhook destinations, and customer data.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
