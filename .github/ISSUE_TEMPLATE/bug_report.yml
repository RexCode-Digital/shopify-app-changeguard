name: Bug report
description: Report a reproducible ChangeGuard problem
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Use a minimal sanitised example. Never include credentials, tokens, merchant/customer data, private source, or production secrets. For suspected vulnerabilities, use the private reporting link."
  - type: input
    id: tool-version
    attributes:
      label: Tool version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js and npm versions
      placeholder: Node.js 22.x; npm 10.x
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      options:
        - CLI
        - GitHub Action
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitised reproduction
      description: Use synthetic configuration and source where possible. Remove credentials, merchant data, private URLs, and secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitised output
      description: Optional. Remove private paths and any sensitive values.
    validations:
      required: false
