name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11.15.0
      - name: Verify tag and package version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run coverage
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run
      - run: npm run package:smoke
      - run: npm run action:check
      - run: git diff --exit-code -- package.json package-lock.json dist
      - name: Publish npm package with provenance
        run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const section = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m).find(part => part.startsWith(`${version}\n`));
          if (!section) throw new Error('Missing release notes for the package version');
          fs.writeFileSync('release-notes.md', `## ${section.trim()}\n`);
          NODE
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "ChangeGuard $GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes

  maintain-minor-alias:
    name: Maintain minor release alias
    permissions:
      contents: write
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Move minor alias to released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          alias="${GITHUB_REF_NAME%.*}"
          git tag -f "$alias" "$GITHUB_SHA"
          git push --force origin "refs/tags/$alias"
