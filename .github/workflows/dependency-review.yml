name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@31c9f175b9cbbdee66d6ab34ed35e2c827f8be10
        with:
          fail-on-severity: high
